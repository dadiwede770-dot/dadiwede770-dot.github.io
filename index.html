<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Alwayne Gallery</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            color: #111;
        }

        header {
            padding: 25px;
            background: white;
            border-bottom: 1px solid #ddd;
        }

        header h1 {
            font-size: 28px;
        }

        main {
            padding: 30px;
            max-width: 1200px;
            margin: auto;
        }

        .welcome {
            margin-bottom: 30px;
        }

        .welcome h2 {
            font-size: 32px;
            margin-bottom: 8px;
        }

        .welcome p {
            color: #666;
        }

        .upload-area {
            background: white;
            border: 2px dashed #ccc;
            border-radius: 16px;
            padding: 50px 20px;
            text-align: center;
            margin-bottom: 30px;
        }

        .upload-area button {
            margin-top: 15px;
            padding: 12px 22px;
            border: none;
            border-radius: 10px;
            background: #111;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        .upload-area button:hover {
            opacity: 0.8;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 18px;
        }

        .photo {
            background: white;
            border-radius: 14px;
            overflow: hidden;
            min-height: 220px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #999;
        }
    </style>
</head>

<body>

    <header>
        <h1>📸 Alwayne Gallery</h1>
    </header>

    <main>

        <section class="welcome">
            <h2>Your memories. Your way.</h2>
            <p>Your personal photo gallery.</p>
        </section>

        <section class="upload-area">
            <h3>Upload your photos</h3>
            <p>Select photos from your device to add them to your gallery.</p>

            <input
                type="file"
                id="photoInput"
                accept="image/*"
                hidden
            >

            <button id="uploadButton">
                ＋ Upload Photos
            </button>
        </section>

        <section class="gallery">

            <div class="photo">
                No photos yet
            </div>

        </section>

    </main>

    <!-- Supabase library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Your Supabase configuration -->
    <script src="supabase.js"></script>

    <!-- Your website functionality -->
    <script src="app.js"></script>

</body>
</html>
